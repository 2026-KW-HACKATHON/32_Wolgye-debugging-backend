name: Deploy

# main 의 CI 가 통과하면 이미지를 ECR 에 올리고 EC2 에 배포한다.
# 설정 방법: docs/worklog/2026-10-06-2205-aws-ec2-배포.md
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC 로 AWS Role 을 맡는다

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # workflow_run 이면 CI 가 검사한 커밋을, 수동 실행이면 고른 브랜치의 커밋을 배포한다
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # 계정 ID 가 마스킹되면 이미지 URI 가 job output 으로 넘어가지 않는다
          mask-aws-account-id: false

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 커밋 sha 태그만 올린다. 배포는 항상 sha 로 하고, 덮어쓰는 태그(latest)는
          # ECR "태그 변경 불가능" 설정에서 두 번째 배포부터 push 가 실패한다
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # 운영 compose · nginx 설정 · 배포 스크립트도 커밋된 버전으로 맞춘다
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml,deploy
          target: ~/chagok

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: bash ~/chagok/deploy/deploy.sh ${{ needs.build-push.outputs.image }}
