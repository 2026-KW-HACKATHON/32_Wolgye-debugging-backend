openapi: 3.1.0
info:
  title: 차곡차곡 API (Mock 명세)
  version: 0.1.0-mock
  description: |
    빌라 골목 주차 공유 앱 **차곡차곡** 백엔드의 Swagger 명세서입니다.
    `app/api/v1/endpoints/*`, `app/schemas/*`, `app/services/*` 를 기준으로 작성했고, **예시 값은 모두 가짜(Mock) 데이터**입니다.

    ### 이 명세서를 볼 때 알아둘 점
    - 현재 구현된 엔드포인트만 담았습니다. 인증이 아직 없어서 `requester_id`, `host_id`, `owner_id` 는 요청 본문에 직접 넣습니다.
    - 응답 `status` 같은 enum 은 **소문자 값**(`pending`, `accepted`, `rejected`)으로 주고받습니다. (DB 에는 대문자 이름으로 저장되지만 API 에는 보이지 않습니다.)
    - 에러 본문은 항상 `{"detail": ...}` 입니다. 도메인 예외는 문자열, 요청 검증 실패(422)는 배열입니다.
    - DB 제약 위반(`IntegrityError`)은 409 와 한글 메시지로 내려갑니다. (`app/core/db_errors.py`)
    - 시간(`start_hour`, `end_hour`)은 정시 단위 정수이며 `24` 는 자정입니다. 요일은 `0`=월 … `6`=일 입니다.

    ### Mock 데이터 시나리오
    | 대상 | 내용 |
    |---|---|
    | 골목 1 | 광운로19가길 — 한울빌라(1), 햇살빌라(2) 가 속함 |
    | 입주민 1 | 김하늘 — 한울빌라 주민, 차량 1 (`12가3456`). 토큰으로 옆 빌라 칸을 빌림 |
    | 입주민 2 | 박서준 — 햇살빌라 관리인, 칸 3 의 공유 조건(1)을 올린 host |
    | 칸 1·2 | 한울빌라 필로티 안쪽 1·2번 (2번의 바로 앞 칸이 1번) |
    | 칸 3 | 햇살빌라 골목 노상 1번 — 월~금 9~18시 시간당 3토큰으로 공유 |
    | 공유 요청 1·2·3 | 대기 / 수락 / 거절 |
  contact:
    name: 차곡차곡 백엔드
servers:
  - url: http://localhost:8000/api/v1
    description: 로컬 (docker compose up)
tags:
  - name: alleys
    description: 골목. 최상위 운영 단위 (골목 > 빌라 > 차고지 > 칸)
  - name: buildings
    description: 빌라/건물. 골목에 속하고 `invite_code` 로 입주민이 합류
  - name: parking-slots
    description: 차고지 안의 번호로 특정되는 주차 칸 (2.5D 배치도 좌표 포함)
  - name: vehicles
    description: 차량. `owner_id` 가 null 이면 관리자가 등록한 미확인 차량
  - name: departures
    description: 출차 예정 (차 배치 화면 n15, 반복 요일 지원)
  - name: share-offers
    description: 칸 공유 조건 (기간·요일·정시 시간대·시간당 토큰)
  - name: share-requests
    description: 공유 조건에 대한 시간제 이용 요청과 수락/거절 (수락 시 토큰 이동)
  - name: health
    description: 상태 확인

paths:
  /alleys:
    get:
      tags: [alleys]
      summary: 골목 목록
      operationId: listAlleys
      responses:
        "200":
          description: 골목 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlleyRead" }
              example:
                - { id: 1, name: 광운로19가길, description: 월계동 광운대 인근 빌라 골목 }
                - { id: 2, name: 월계로 12길, description: null }
    post:
      tags: [alleys]
      summary: 골목 생성
      operationId: createAlley
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlleyCreate" }
            example: { name: 광운로19가길, description: 월계동 광운대 인근 빌라 골목 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlleyRead" }
              example: { id: 1, name: 광운로19가길, description: 월계동 광운대 인근 빌라 골목 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /alleys/{alley_id}:
    get:
      tags: [alleys]
      summary: 골목 상세
      operationId: getAlley
      parameters:
        - { $ref: "#/components/parameters/AlleyId" }
      responses:
        "200":
          description: 골목
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlleyRead" }
              example: { id: 1, name: 광운로19가길, description: 월계동 광운대 인근 빌라 골목 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /buildings:
    get:
      tags: [buildings]
      summary: 빌라 목록
      operationId: listBuildings
      responses:
        "200":
          description: 빌라 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BuildingRead" }
              example:
                - { id: 1, alley_id: 1, name: 한울빌라, address: 서울특별시 노원구 광운로19가길 12, detail_address: A동 }
                - { id: 2, alley_id: 1, name: 햇살빌라, address: 서울특별시 노원구 광운로19가길 18, detail_address: null }
    post:
      tags: [buildings]
      summary: 빌라 등록 (운영팀)
      description: "`invite_code` 는 입주민이 합류할 때 쓰는 코드이며 응답에는 포함되지 않습니다. 중복이면 409."
      operationId: createBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildingCreate" }
            example:
              alley_id: 1
              name: 한울빌라
              address: 서울특별시 노원구 광운로19가길 12
              detail_address: A동
              invite_code: HANUL2026
      responses:
        "201":
          description: 생성됨 (invite_code 미포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildingRead" }
              example: { id: 1, alley_id: 1, name: 한울빌라, address: 서울특별시 노원구 광운로19가길 12, detail_address: A동 }
        "409":
          description: 초대코드 중복 또는 존재하지 않는 골목
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                duplicateInviteCode: { value: { detail: 이미 사용 중인 초대코드입니다. } }
                alleyMissing: { value: { detail: 참조한 데이터가 존재하지 않습니다. } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /buildings/{building_id}:
    get:
      tags: [buildings]
      summary: 빌라 상세
      operationId: getBuilding
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
      responses:
        "200":
          description: 빌라
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildingRead" }
              example: { id: 1, alley_id: 1, name: 한울빌라, address: 서울특별시 노원구 광운로19가길 12, detail_address: A동 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /parking-slots:
    get:
      tags: [parking-slots]
      summary: 주차 칸 목록
      operationId: listParkingSlots
      parameters:
        - name: building_id
          in: query
          required: false
          description: 해당 빌라의 차고지에 속한 칸만 조회
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: 칸 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParkingSlotRead" }
              example:
                - { id: 1, garage_id: 1, number: 1, front_slot_id: null, render_x0: 0.0, render_y0: 0.0, render_x1: 2.5, render_y1: 5.0, is_active: true }
                - { id: 2, garage_id: 1, number: 2, front_slot_id: 1, render_x0: 0.0, render_y0: 5.0, render_x1: 2.5, render_y1: 10.0, is_active: true }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [parking-slots]
      summary: 주차 칸 생성
      description: "같은 차고지에 같은 `number` 가 있으면 409. `number` 는 1 이상, `front_slot_id` 는 자기 자신 불가."
      operationId: createParkingSlot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParkingSlotCreate" }
            example: { garage_id: 1, number: 2, front_slot_id: 1, render_x0: 0.0, render_y0: 5.0, render_x1: 2.5, render_y1: 10.0 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParkingSlotRead" }
              example: { id: 2, garage_id: 1, number: 2, front_slot_id: 1, render_x0: 0.0, render_y0: 5.0, render_x1: 2.5, render_y1: 10.0, is_active: true }
        "409":
          description: 제약 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                duplicateNumber: { value: { detail: 같은 차고지에 같은 번호의 칸이 있습니다. } }
                invalidNumber: { value: { detail: 칸 번호는 1 이상이어야 합니다. } }
                selfFront: { value: { detail: 자기 자신을 앞 칸으로 지정할 수 없습니다. } }
                garageMissing: { value: { detail: 참조한 데이터가 존재하지 않습니다. } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /parking-slots/{slot_id}:
    get:
      tags: [parking-slots]
      summary: 주차 칸 상세
      operationId: getParkingSlot
      parameters:
        - { $ref: "#/components/parameters/SlotId" }
      responses:
        "200":
          description: 칸
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParkingSlotRead" }
              example: { id: 3, garage_id: 2, number: 1, front_slot_id: null, render_x0: 0.0, render_y0: 0.0, render_x1: 2.5, render_y1: 5.0, is_active: true }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /vehicles:
    get:
      tags: [vehicles]
      summary: 차량 목록
      operationId: listVehicles
      responses:
        "200":
          description: 차량 목록. `owner_id` 가 null 이면 미확인 차량
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleRead" }
              example:
                - { id: 1, plate_no: 12가3456, color: 흰색, nickname: 하늘이 차, is_primary: true, owner_id: 1 }
                - { id: 2, plate_no: 34나7890, color: 검정, nickname: null, is_primary: true, owner_id: 2 }
                - { id: 3, plate_no: 56다1234, color: null, nickname: null, is_primary: false, owner_id: null }
    post:
      tags: [vehicles]
      summary: 차량 등록
      description: |
        `owner_id` 를 생략하면 관리자가 등록한 **미확인 차량**이 됩니다.
        차량 번호는 전체에서 유일하고, 대표 차량(`is_primary`)은 사용자당 한 대입니다.
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleCreate" }
            examples:
              resident:
                summary: 입주민 차량
                value: { plate_no: 12가3456, color: 흰색, nickname: 하늘이 차, is_primary: true, owner_id: 1 }
              unknown:
                summary: 미확인 차량 (관리자 등록)
                value: { plate_no: 56다1234 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleRead" }
              example: { id: 1, plate_no: 12가3456, color: 흰색, nickname: 하늘이 차, is_primary: true, owner_id: 1 }
        "409":
          description: 제약 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                duplicatePlate: { value: { detail: 이미 등록된 차량 번호입니다. } }
                duplicatePrimary: { value: { detail: 대표 차량은 한 대만 지정할 수 있습니다. } }
                ownerMissing: { value: { detail: 참조한 데이터가 존재하지 않습니다. } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /vehicles/{vehicle_id}:
    get:
      tags: [vehicles]
      summary: 차량 상세
      operationId: getVehicle
      parameters:
        - { $ref: "#/components/parameters/VehicleId" }
      responses:
        "200":
          description: 차량
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleRead" }
              example: { id: 1, plate_no: 12가3456, color: 흰색, nickname: 하늘이 차, is_primary: true, owner_id: 1 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /departures:
    get:
      tags: [departures]
      summary: 출차 예정 목록
      operationId: listDepartures
      parameters:
        - name: vehicle_id
          in: query
          required: false
          description: 해당 차량의 출차 예정만 조회
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: 출차 예정 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartureScheduleRead" }
              example:
                - { id: 1, vehicle_id: 1, scheduled_date: "2026-10-02", scheduled_time: "08:30:00", repeat_weekdays: [], memo: 내일 병원 가요, is_ai_estimated: false }
                - { id: 2, vehicle_id: 1, scheduled_date: "2026-10-05", scheduled_time: "08:00:00", repeat_weekdays: [0, 1, 2, 3, 4], memo: 평일 출근, is_ai_estimated: false }
                - { id: 3, vehicle_id: 2, scheduled_date: "2026-10-02", scheduled_time: "07:50:00", repeat_weekdays: [], memo: null, is_ai_estimated: true }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [departures]
      summary: 출차 예정 등록
      description: |
        차 배치 화면(n15)에서 '내일 몇 시에 나가요' 등록 시 호출합니다.
        반복이면 `repeat_weekdays` 에 요일(0=월 … 6=일)을 넣고, 이때 `scheduled_date` 는 반복 시작일입니다.
        `is_ai_estimated` 는 서버가 정하며 요청에서 받지 않습니다 (사용자 등록은 항상 `false`).
      operationId: createDeparture
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartureScheduleCreate" }
            examples:
              once:
                summary: 하루만
                value: { vehicle_id: 1, scheduled_date: "2026-10-02", scheduled_time: "08:30:00", memo: 내일 병원 가요 }
              weekly:
                summary: 평일 반복
                value: { vehicle_id: 1, scheduled_date: "2026-10-05", scheduled_time: "08:00:00", repeat_weekdays: [0, 1, 2, 3, 4], memo: 평일 출근 }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartureScheduleRead" }
              example: { id: 1, vehicle_id: 1, scheduled_date: "2026-10-02", scheduled_time: "08:30:00", repeat_weekdays: [], memo: 내일 병원 가요, is_ai_estimated: false }
        "409":
          description: 제약 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                badWeekday: { value: { detail: 반복 요일은 0(월)~6(일) 사이여야 합니다. } }
                vehicleMissing: { value: { detail: 참조한 데이터가 존재하지 않습니다. } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /departures/{schedule_id}:
    get:
      tags: [departures]
      summary: 출차 예정 상세
      operationId: getDeparture
      parameters:
        - { $ref: "#/components/parameters/ScheduleId" }
      responses:
        "200":
          description: 출차 예정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartureScheduleRead" }
              example: { id: 1, vehicle_id: 1, scheduled_date: "2026-10-02", scheduled_time: "08:30:00", repeat_weekdays: [], memo: 내일 병원 가요, is_ai_estimated: false }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /share-offers:
    get:
      tags: [share-offers]
      summary: 공유 조건 목록
      operationId: listShareOffers
      parameters:
        - name: slot_id
          in: query
          required: false
          description: 해당 칸의 공유 조건만 조회
          schema: { type: integer }
          example: 3
        - name: public_only
          in: query
          required: false
          description: "`true` 면 공개 중인 조건만 (공유 중단은 제외)"
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 공유 조건 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareOfferRead" }
              example:
                - id: 1
                  slot_id: 3
                  host_id: 2
                  start_date: "2026-10-01"
                  end_date: "2026-12-31"
                  available_weekdays: [0, 1, 2, 3, 4]
                  start_hour: 9
                  end_hour: 18
                  hourly_price: 3
                  max_hours: 4
                  memo: 평일 낮에 비어 있어요
                  is_public: true
                  created_at: "2026-09-30T10:00:00Z"
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [share-offers]
      summary: 공유 조건 등록
      description: |
        관리인이 칸을 기간·요일·시간·시간당 토큰으로 공유합니다 (차고지 등록 n45).
        칸 하나에 기간별로 여러 개 만들 수 있고, `is_public` 이 `false` 면 공유 중단 상태입니다.
        `hourly_price` 가 0 이면 무료, `max_hours` 가 null 이면 이용 시간 제한이 없습니다.
      operationId: createShareOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareOfferCreate" }
            example:
              slot_id: 3
              host_id: 2
              start_date: "2026-10-01"
              end_date: "2026-12-31"
              available_weekdays: [0, 1, 2, 3, 4]
              start_hour: 9
              end_hour: 18
              hourly_price: 3
              max_hours: 4
              memo: 평일 낮에 비어 있어요
              is_public: true
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareOfferRead" }
              example:
                id: 1
                slot_id: 3
                host_id: 2
                start_date: "2026-10-01"
                end_date: "2026-12-31"
                available_weekdays: [0, 1, 2, 3, 4]
                start_hour: 9
                end_hour: 18
                hourly_price: 3
                max_hours: 4
                memo: 평일 낮에 비어 있어요
                is_public: true
                created_at: "2026-09-30T10:00:00Z"
        "409":
          description: 제약 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                badDates: { value: { detail: 공유 시작일은 종료일보다 늦을 수 없습니다. } }
                badHours: { value: { detail: 공유 시간은 0~24시 사이, 시작 시가 종료 시보다 앞서야 합니다. } }
                badMaxHours: { value: { detail: 최대 이용 시간은 0보다 커야 합니다. } }
                refMissing: { value: { detail: 참조한 데이터가 존재하지 않습니다. } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /share-offers/{offer_id}:
    get:
      tags: [share-offers]
      summary: 공유 조건 상세
      operationId: getShareOffer
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      responses:
        "200":
          description: 공유 조건
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareOfferRead" }
              example:
                id: 1
                slot_id: 3
                host_id: 2
                start_date: "2026-10-01"
                end_date: "2026-12-31"
                available_weekdays: [0, 1, 2, 3, 4]
                start_hour: 9
                end_hour: 18
                hourly_price: 3
                max_hours: 4
                memo: 평일 낮에 비어 있어요
                is_public: true
                created_at: "2026-09-30T10:00:00Z"
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /share-requests:
    get:
      tags: [share-requests]
      summary: 공유 요청 목록
      operationId: listShareRequests
      parameters:
        - name: status
          in: query
          required: false
          description: 상태로 필터
          schema: { $ref: "#/components/schemas/ShareRequestStatus" }
          example: pending
      responses:
        "200":
          description: 공유 요청 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareRequestRead" }
              example:
                - id: 1
                  offer_id: 1
                  slot_id: 3
                  requester_id: 1
                  vehicle_id: 1
                  request_date: "2026-10-05"
                  start_hour: 10
                  end_hour: 13
                  total_price: 9
                  status: pending
                  reject_reason: null
                  created_at: "2026-10-01T09:00:00Z"
                  responded_at: null
                - id: 2
                  offer_id: 1
                  slot_id: 3
                  requester_id: 1
                  vehicle_id: 1
                  request_date: "2026-10-06"
                  start_hour: 14
                  end_hour: 16
                  total_price: 6
                  status: accepted
                  reject_reason: null
                  created_at: "2026-10-01T09:05:00Z"
                  responded_at: "2026-10-01T09:30:00Z"
                - id: 3
                  offer_id: 1
                  slot_id: 3
                  requester_id: 1
                  vehicle_id: null
                  request_date: "2026-10-07"
                  start_hour: 9
                  end_hour: 11
                  total_price: 6
                  status: rejected
                  reject_reason: 그 시간에는 제가 사용해요
                  created_at: "2026-10-01T09:10:00Z"
                  responded_at: "2026-10-01T09:40:00Z"
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [share-requests]
      summary: 공유 요청 생성
      description: |
        입주민이 옆 빌라 골목 공유 칸을 시간제로 요청합니다 (화면 4 상단).

        서버가 검증하는 규칙 (모두 409):
        - 공유 조건이 공개 중일 것
        - `request_date` 가 공유 기간 안이고 허용 요일일 것
        - `start_hour`/`end_hour` 가 공유 시간대 안이고, 이용 시간이 `max_hours` 이하일 것
        - 요청자가 공유 조건의 host 가 아닐 것
        - 요청자의 토큰 잔액이 `total_price` 이상일 것 (실제 차감은 **수락할 때**)

        `total_price` 는 `(end_hour - start_hour) × hourly_price` 로 서버가 계산해 고정하고, `slot_id` 는 공유 조건에서 가져옵니다.
      operationId: createShareRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRequestCreate" }
            example:
              offer_id: 1
              requester_id: 1
              vehicle_id: 1
              request_date: "2026-10-05"
              start_hour: 10
              end_hour: 13
      responses:
        "201":
          description: 생성됨 (`status` 는 항상 `pending`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareRequestRead" }
              example:
                id: 1
                offer_id: 1
                slot_id: 3
                requester_id: 1
                vehicle_id: 1
                request_date: "2026-10-05"
                start_hour: 10
                end_hour: 13
                total_price: 9
                status: pending
                reject_reason: null
                created_at: "2026-10-01T09:00:00Z"
                responded_at: null
        "404":
          description: 공유 조건 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: Share offer not found }
        "409":
          description: 공유 조건 위반 / 잔액 부족 / DB 제약 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notPublic: { value: { detail: Share offer is not public } }
                outsideDate: { value: { detail: Requested date is outside the share offer } }
                outsideHours: { value: { detail: Requested hours are outside the share offer } }
                exceedMaxHours: { value: { detail: Requested hours exceed max_hours } }
                ownOffer: { value: { detail: Cannot request own share offer } }
                notEnoughTokens: { value: { detail: Not enough tokens } }
                refMissing: { value: { detail: 참조한 데이터가 존재하지 않습니다. } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /share-requests/{request_id}/decision:
    post:
      tags: [share-requests]
      summary: 공유 요청 수락/거절
      description: |
        관리자가 수락/거절합니다 (화면 4: 거절 / 수락 버튼). `pending` 인 요청만 처리할 수 있습니다.

        **수락**하면 요청자의 토큰 `total_price` 가 공유 조건의 host 에게 넘어가고 `token_transfers` 에 기록됩니다.
        - 같은 칸에 이미 수락된 시간과 겹치면 409 (토큰은 이동하지 않음)
        - 요청자 잔액이 그 사이 부족해졌으면 409 `Not enough tokens`
        - 요청 행을 잠그고 처리하므로 동시에 두 번 수락해도 토큰은 한 번만 이동합니다
      operationId: decideShareRequest
      parameters:
        - { $ref: "#/components/parameters/RequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRequestDecision" }
            examples:
              accept:
                summary: 수락
                value: { status: accepted }
              reject:
                summary: 거절
                value: { status: rejected, reject_reason: 그 시간에는 제가 사용해요 }
      responses:
        "200":
          description: 처리됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareRequestRead" }
              examples:
                accepted:
                  summary: 수락 결과
                  value:
                    id: 2
                    offer_id: 1
                    slot_id: 3
                    requester_id: 1
                    vehicle_id: 1
                    request_date: "2026-10-06"
                    start_hour: 14
                    end_hour: 16
                    total_price: 6
                    status: accepted
                    reject_reason: null
                    created_at: "2026-10-01T09:05:00Z"
                    responded_at: "2026-10-01T09:30:00Z"
                rejected:
                  summary: 거절 결과
                  value:
                    id: 3
                    offer_id: 1
                    slot_id: 3
                    requester_id: 1
                    vehicle_id: null
                    request_date: "2026-10-07"
                    start_hour: 9
                    end_hour: 11
                    total_price: 6
                    status: rejected
                    reject_reason: 그 시간에는 제가 사용해요
                    created_at: "2026-10-01T09:10:00Z"
                    responded_at: "2026-10-01T09:40:00Z"
        "404":
          description: 요청 또는 (토큰 이동 시) 주민 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                requestMissing: { value: { detail: Share request not found } }
                residentMissing: { value: { detail: Resident not found } }
        "409":
          description: 이미 처리됨 / 시간 겹침 / 잔액 부족
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                alreadyDecided: { value: { detail: Already decided } }
                overlap: { value: { detail: 같은 칸에 이미 수락된 공유 시간과 겹칩니다. } }
                notEnoughTokens: { value: { detail: Not enough tokens } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health:
    get:
      tags: [health]
      summary: 상태 확인
      description: "주의: 다른 API 와 달리 `/api/v1` 접두사가 붙지 않는 `/health` 입니다."
      operationId: health
      servers:
        - url: http://localhost:8000
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
              example: { status: ok }

components:
  parameters:
    AlleyId:
      { name: alley_id, in: path, required: true, schema: { type: integer }, example: 1 }
    BuildingId:
      { name: building_id, in: path, required: true, schema: { type: integer }, example: 1 }
    SlotId:
      { name: slot_id, in: path, required: true, schema: { type: integer }, example: 3 }
    VehicleId:
      { name: vehicle_id, in: path, required: true, schema: { type: integer }, example: 1 }
    ScheduleId:
      { name: schedule_id, in: path, required: true, schema: { type: integer }, example: 1 }
    OfferId:
      { name: offer_id, in: path, required: true, schema: { type: integer }, example: 1 }
    RequestId:
      { name: request_id, in: path, required: true, schema: { type: integer }, example: 1 }

  responses:
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: Resource not found }
    ValidationError:
      description: 요청 형식 오류 (FastAPI/Pydantic 검증 실패)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPValidationError" }
          example:
            detail:
              - { type: missing, loc: [body, name], msg: Field required, input: {} }

  schemas:
    Error:
      type: object
      description: 도메인 예외(404/403/409/400)와 DB 제약 위반(409)의 공통 본문
      required: [detail]
      properties:
        detail: { type: string }
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items: { $ref: "#/components/schemas/ValidationErrorItem" }
    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items: { type: [string, integer] }
        msg: { type: string }
        type: { type: string }
        input: {}

    Weekdays:
      type: array
      description: 요일 목록. 0=월, 1=화, 2=수, 3=목, 4=금, 5=토, 6=일
      items: { type: integer, minimum: 0, maximum: 6 }

    AlleyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 골목 이름, examples: [광운로19가길] }
        description: { type: [string, "null"], default: null }
    AlleyRead:
      allOf:
        - $ref: "#/components/schemas/AlleyCreate"
        - type: object
          required: [id]
          properties:
            id: { type: integer }

    BuildingCreate:
      type: object
      required: [alley_id, name, address, invite_code]
      properties:
        alley_id: { type: integer }
        name: { type: string }
        address: { type: string }
        detail_address: { type: [string, "null"], default: null }
        invite_code: { type: string, maxLength: 12, description: 입주민 합류용 초대코드 (유일, 최대 12자) }
    BuildingRead:
      type: object
      required: [id, alley_id, name, address]
      properties:
        id: { type: integer }
        alley_id: { type: integer }
        name: { type: string }
        address: { type: string }
        detail_address: { type: [string, "null"] }

    ParkingSlotCreate:
      type: object
      required: [garage_id, number]
      properties:
        garage_id: { type: integer, description: 소속 차고지 }
        number: { type: integer, minimum: 1, description: 차고지 안의 칸 번호 }
        front_slot_id: { type: [integer, "null"], default: null, description: 바로 앞 칸 (막힘 판정용) }
        render_x0: { type: [number, "null"], default: null, description: "2.5D 배치도 로컬 좌표 (건물 기준 미터)" }
        render_y0: { type: [number, "null"], default: null }
        render_x1: { type: [number, "null"], default: null }
        render_y1: { type: [number, "null"], default: null }
    ParkingSlotRead:
      allOf:
        - $ref: "#/components/schemas/ParkingSlotCreate"
        - type: object
          required: [id, is_active]
          properties:
            id: { type: integer }
            is_active: { type: boolean, description: 사용 여부. 칸은 삭제 대신 비활성화 }

    VehicleCreate:
      type: object
      required: [plate_no]
      properties:
        plate_no: { type: string, description: 차량 번호 (유일) }
        color: { type: [string, "null"], default: null }
        nickname: { type: [string, "null"], default: null }
        is_primary: { type: boolean, default: false, description: 대표 차량 (사용자당 한 대) }
        owner_id: { type: [integer, "null"], default: null, description: null 이면 미확인 차량 }
    VehicleRead:
      type: object
      required: [id, plate_no, is_primary]
      properties:
        id: { type: integer }
        plate_no: { type: string }
        color: { type: [string, "null"] }
        nickname: { type: [string, "null"] }
        is_primary: { type: boolean }
        owner_id: { type: [integer, "null"] }

    DepartureScheduleCreate:
      type: object
      required: [vehicle_id, scheduled_date, scheduled_time]
      properties:
        vehicle_id: { type: integer }
        scheduled_date: { type: string, format: date, description: 출차 날짜. 반복이면 반복 시작일 }
        scheduled_time: { type: string, format: time, description: 출차 시각 (시간대 없음, 서버는 Asia/Seoul 로 해석) }
        repeat_weekdays:
          allOf:
            - $ref: "#/components/schemas/Weekdays"
          default: []
        memo: { type: [string, "null"], default: null }
    DepartureScheduleRead:
      type: object
      required: [id, vehicle_id, scheduled_date, scheduled_time, repeat_weekdays, is_ai_estimated]
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        scheduled_date: { type: string, format: date }
        scheduled_time: { type: string, format: time }
        repeat_weekdays: { $ref: "#/components/schemas/Weekdays" }
        memo: { type: [string, "null"] }
        is_ai_estimated: { type: boolean, description: AI 추정값이면 true (사용자 등록값이 있으면 그쪽이 우선) }

    ShareOfferCreate:
      type: object
      required: [slot_id, host_id, start_date, end_date, start_hour, end_hour]
      properties:
        slot_id: { type: integer }
        host_id: { type: integer, description: 토큰을 받는 칸 주인 (인증 도입 전이라 본문으로 받음) }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: 포함. start_date 이상이어야 함 }
        available_weekdays:
          allOf:
            - $ref: "#/components/schemas/Weekdays"
          default: [0, 1, 2, 3, 4, 5, 6]
        start_hour: { type: integer, minimum: 0, maximum: 23 }
        end_hour: { type: integer, minimum: 1, maximum: 24, description: "24 = 자정. start_hour 보다 커야 함" }
        hourly_price: { type: integer, minimum: 0, default: 0, description: 시간당 토큰. 0 = 무료 }
        max_hours: { type: [integer, "null"], default: null, description: 요청 1건 최대 이용 시간. null = 제한 없음 }
        memo: { type: [string, "null"], default: null }
        is_public: { type: boolean, default: true, description: false 면 공유 중단 }
    ShareOfferRead:
      allOf:
        - type: object
          required: [id, created_at]
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
        - $ref: "#/components/schemas/ShareOfferCreate"

    ShareRequestStatus:
      type: string
      enum: [pending, accepted, rejected]
      description: 대기 / 수락 / 거절
    ShareRequestCreate:
      type: object
      required: [offer_id, requester_id, request_date, start_hour, end_hour]
      properties:
        offer_id: { type: integer }
        requester_id: { type: integer, description: 요청자 (인증 도입 전이라 본문으로 받음) }
        vehicle_id: { type: [integer, "null"], default: null, description: 이용 차량 }
        request_date: { type: string, format: date }
        start_hour: { type: integer, minimum: 0, maximum: 23 }
        end_hour: { type: integer, minimum: 1, maximum: 24, description: "24 = 자정. start_hour 보다 커야 함 (아니면 422)" }
    ShareRequestRead:
      type: object
      required: [id, offer_id, slot_id, requester_id, request_date, start_hour, end_hour, total_price, status, created_at]
      properties:
        id: { type: integer }
        offer_id: { type: integer }
        slot_id: { type: integer, description: 공유 조건의 칸 (서버가 채움) }
        requester_id: { type: integer }
        vehicle_id: { type: [integer, "null"] }
        request_date: { type: string, format: date }
        start_hour: { type: integer }
        end_hour: { type: integer }
        total_price: { type: integer, description: 요청 시 고정되는 토큰 총액 (시간 수 × 시간당 토큰) }
        status: { $ref: "#/components/schemas/ShareRequestStatus" }
        reject_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        responded_at: { type: [string, "null"], format: date-time }
    ShareRequestDecision:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
          description: "`pending` 은 보낼 수 없음 (422)"
        reject_reason: { type: [string, "null"], default: null, description: 거절 사유 }
