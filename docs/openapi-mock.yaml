  # ───────────────────────── 주차 배치 · 출차 ─────────────────────────
  /buildings/{building_id}/slots/recommendations:
    get:
      tags: [parkings]
      summary: 🏠 배치 등록 화면 태그·추천 (#7)
      description: |
        출차 시간을 바꿀 때마다 다시 호출합니다. 빌라의 모든 칸을 칸 이름 순(`P1`, `P2` …)으로 하나씩 내려주고, 칸마다 태그를 하나 붙입니다.

        **태그** (열린 질문 19, 2026-10-03 확정)
        - `UNAVAILABLE`: 쓸 수 없는 칸. `unavailable_reason` = `관리인이 사용 중지한 칸이에요`(`is_active=false`) 또는 `예약된 칸이에요`(지금부터 내 출차 시각까지 — 상시 주차면 그 이후 전부 — 수락된 공유가 있음)
        - `OCCUPIED`: 지금 다른 차가 주차 중인 칸
        - `RECOMMENDED`: 아래 조건을 만족하는 빈 칸 중 **가장 이상적인 한 칸**. 응답에 최대 1개이고, 조건에 맞는 칸이 없으면 **추천하지 않습니다** (모든 빈 칸이 `EMPTY`)
        - `EMPTY`: 나머지 빈 칸. 여기 두면 막게 되는 칸이 있으면 `will_block` 에 넣습니다 (없으면 빈 배열)

        **추천 조건** (막힘 규칙은 결정 1, `services/blocking.py`)
        1. 내가 막히지 않는다: 앞 칸(`front_slot_id`)이 비어 있거나, 앞 칸 차가 내 출차 시각보다 먼저(같거나 이르게) 나간다
        2. 내가 아무도 막지 않는다: 이 칸을 앞 칸으로 두는 뒤 칸에 차가 없거나, 그 차가 나보다 늦게(같거나) 나간다
        - 출차 시간이 없는 차(상시 주차·미확인 차량)는 가장 늦게 나가는 것으로 봅니다. 내가 상시 주차(`expected_exit_at` 생략)면 1은 항상 만족합니다
        - 외부 차량(공유 이용자)의 출차 시각은 수락된 공유의 종료 시각입니다

        **가장 이상적인 칸 고르기**: 조건을 만족하는 칸 중
        1. 가장 안쪽 칸. 안쪽 = 앞 칸(`front_slot_id`)을 따라 출구까지 거치는 칸 수가 많은 칸
        2. 같으면 칸 이름 순서가 빠른 칸 (`P` 번호가 작은 칸)

        ⚠️ `expected_exit_at` 의 `+` 는 쿼리 문자열에서 공백으로 해석되므로 **`%2B` 로 인코딩**해야 합니다.
      operationId: getSlotRecommendations
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
        - name: vehicle_id
          in: query
          required: true
          schema: { type: integer }
          example: 7
        - name: expected_exit_at
          in: query
          required: false
          description: 상시 주차면 생략
          schema: { type: string, format: date-time }
          example: "2026-10-01T07:30:00+09:00"
      responses:
        "200":
          description: 칸별 태그
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items: { $ref: "#/components/schemas/SlotRecommendation" }
              example:
                slots:
                  # 빌라 3, 내일 07:30 출차. P7(1007)의 앞 칸은 P8(1008), 둘 다 비어 있음
                  - { slot_id: 1001, tag: OCCUPIED, label: P1 }
                  - { slot_id: 1002, tag: OCCUPIED, label: P2 }
                  - { slot_id: 1003, tag: OCCUPIED, label: P3 }
                  - { slot_id: 1004, tag: OCCUPIED, label: P4 }
                  - { slot_id: 1005, tag: UNAVAILABLE, label: P5, unavailable_reason: 관리인이 사용 중지한 칸이에요 }
                  - { slot_id: 1006, tag: OCCUPIED, label: P6 }
                  - { slot_id: 1007, tag: RECOMMENDED, label: P7, reason: 앞 칸이 비어 있고 다른 차를 막지 않는 가장 안쪽 칸이에요 }
                  - { slot_id: 1008, tag: EMPTY, label: P8, will_block: [] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingMember" }
  /parkings:
    post:
      tags: [parkings]
      summary: 🏠 "여기에 배치하기" (#7)
      description: |
        - `is_long_term=true`(상시 주차) 면 `expected_exit_at` 을 생략할 수 있습니다
        - `repeat_weekdays=true`(평일 반복) 면 평일(월~금) 같은 시각으로 반복 일정을 함께 만듭니다. 요일을 직접 고르려면 #9 API 사용
        - 사용 불가 칸 → 409 `SLOT_UNAVAILABLE` + `detail.reason` → **사용 불가 안내 모달(#11)**. 사유는 `관리인이 사용 중지한 칸`(`is_active=false`) 또는 `예약된 상태`(그 시간에 수락된 공유 요청이 있음)
        - 동시성: 해당 칸과 앞·뒤 칸을 `SELECT ... FOR UPDATE` 로 잠근 뒤 재검증
      operationId: createParking
      x-priority: 1주차
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParkingCreate" }
            examples:
              normal:
                summary: 내일 07:30 출차, 평일 반복
                value: { slot_id: 1001, vehicle_id: 7, is_long_term: false, expected_exit_at: "2026-10-01T07:30:00+09:00", repeat_weekdays: true, memo: 출근 }
              longTerm:
                summary: 상시 주차
                value: { slot_id: 1001, vehicle_id: 7, is_long_term: true, repeat_weekdays: false }
      responses:
        "201":
          description: 배치됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParkingCreated" }
              example: { id: 556, slot_id: 1001, state: PARKED, expected_exit_at: "2026-10-01T07:30:00+09:00", exit_source: MANUAL, blocking: [] }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingMember" }
        "409":
          description: 칸 사용 불가 / 사용 중 / 이미 주차 중
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unavailable:
                  summary: 사용 불가 칸 (#11 모달)
                  value: { error: { code: SLOT_UNAVAILABLE, message: 해당 칸을 사용할 수 없습니다., detail: { reason: 예약된 상태 } } }
                occupied:
                  value: { error: { code: SLOT_OCCUPIED, message: 이미 다른 차량이 주차 중인 칸입니다., detail: null } }
                alreadyParked:
                  value: { error: { code: VEHICLE_ALREADY_PARKED, message: 이미 주차 중인 차량입니다., detail: { parking_id: 556 } } }
  /parkings/{parking_id}/schedule:
    put:
      tags: [parkings]
      summary: 🏠 출차 일정 수정 (#8)
      description: |
        배치는 그대로 두고 시간만 바꿉니다. **시간이 앞당겨지고 이 차를 막는 차가 있으면 즉시 알림**(제안 13-2)을 보냅니다.
      operationId: updateParkingSchedule
      x-priority: 1주차
      parameters:
        - { $ref: "#/components/parameters/ParkingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_exit_at]
              properties:
                expected_exit_at: { type: string, format: date-time }
                memo: { type: [string, "null"] }
            example: { expected_exit_at: "2026-09-30T19:00:00+09:00", memo: 늦게 출근 }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  parking_id: { type: integer }
                  expected_exit_at: { type: string, format: date-time }
                  exit_source: { $ref: "#/components/schemas/ExitSource" }
                  memo: { type: [string, "null"] }
              example: { parking_id: 556, expected_exit_at: "2026-09-30T19:00:00+09:00", exit_source: MANUAL, memo: 늦게 출근 }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parkings/{parking_id}/exit:
    post:
      tags: [parkings]
      summary: 🏠 출차 처리
      description: 같은 빌라 입주민에게 `EXIT_DONE` 알림("P4 비어 있음")을 보냅니다.
      operationId: exitParking
      x-priority: 1주차
      parameters:
        - { $ref: "#/components/parameters/ParkingId" }
      responses:
        "200":
          description: 출차됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  state: { $ref: "#/components/schemas/ParkingState" }
                  actual_exit_at: { type: string, format: date-time }
                  on_time: { type: boolean, description: 예정 시각 대비 정시 출차 여부 }
              example: { id: 556, state: EXITED, actual_exit_at: "2026-09-30T18:25:00+09:00", on_time: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── 이동 요청 ─────────────────────────
  /move-requests:
    post:
      tags: [move-requests]
      summary: 🏠 이동 요청 보내기 (#6 막힘 카드, #18)
      description: |
        관리인은 외부 차량(`EXTERNAL`)에도 요청할 수 있습니다.
        `UNKNOWN` 차량은 연락 수단이 없어("앱으로 연락 불가") 400 입니다.
        같은 차에 대기 중인 요청이 있으면 409 (제안 코드).
        긴급 여부는 따로 두지 않습니다. 수신자에게는 일반 `MOVE_REQUEST` 알림이 갑니다.
      operationId: createMoveRequest
      x-priority: 2주차
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_parking_id, needed_at]
              properties:
                target_parking_id: { type: integer, description: 이동을 요청할 차량의 주차 건 }
                needed_at: { type: string, format: date-time, description: 출차가 필요한 시각 }
                reason: { type: [string, "null"] }
            example:
              target_parking_id: 555
              needed_at: "2026-09-30T15:00:00+09:00"
              reason: 외출 예정으로 출차가 필요합니다.
      responses:
        "201":
          description: 요청됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/MoveRequestStatus" }
              example: { id: 44, status: PENDING }
        "400":
          description: 검증 실패 / 미확인 차량
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: INVALID_INPUT, message: 앱으로 연락할 수 없는 차량입니다., detail: { reason: UNKNOWN_VEHICLE } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingMember" }
        "409":
          description: 이미 대기 중인 요청 (제안 코드)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: MOVE_REQUEST_ALREADY_PENDING, message: 이 차량에 대기 중인 이동 요청이 이미 있습니다., detail: { move_request_id: 44 } } }
  /move-requests/{move_request_id}:
    get:
      tags: [move-requests]
      summary: 🏠 이동 요청 수신 화면 (#12)
      description: |
        요청자는 동까지만 익명으로 표시합니다. `my_vehicle` 은 이동을 요청받은 내 차량, `blocked_vehicle` 은 막힌 차량입니다.
        공유 이용자(외부)가 관련되면 차량번호 마스킹이 필요합니다 (열린 질문, Notion 14-8).
      operationId: getMoveRequest
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/MoveRequestId" }
      responses:
        "200":
          description: 이동 요청 상세 (수신자 302호 시점)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveRequestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingMember" }
        "404": { $ref: "#/components/responses/NotFound" }
  /move-requests/{move_request_id}/done:
    post:
      tags: [move-requests]
      summary: 🏠 "옮겼어요" (#12)
      description: 요청 상태를 `MOVED` 로 바꿉니다. 응답 시간은 차곡이 온도에 반영합니다. 와이어프레임에 요청자용 결과 알림이 없어 알림은 보내지 않습니다 (요청자 홈의 막힘 카드가 사라짐).
      operationId: doneMoveRequest
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/MoveRequestId" }
      responses:
        "200":
          description: 처리됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/MoveRequestStatus" }
                  responded_at: { type: string, format: date-time }
              example: { id: 44, status: MOVED, responded_at: "2026-09-30T14:41:00+09:00" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 처리된 요청 (제안 코드)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: ALREADY_DECIDED, message: 이미 처리된 요청입니다., detail: { status: MOVED } } }
  /me/move-requests:
    get:
      tags: [move-requests]
      summary: 👤 내 이동 요청 목록
      operationId: listMyMoveRequests
      x-priority: 2주차
      parameters:
        - name: box
          in: query
          required: true
          description: 받은 요청 / 보낸 요청
          schema: { type: string, enum: [received, sent] }
          example: received
      responses:
        "200":
          description: 이동 요청 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        status: { $ref: "#/components/schemas/MoveRequestStatus" }
                        requested_at: { type: string, format: date-time }
                        counterpart_label: { type: string, description: 상대방 표기 (동까지만) }
                        needed_at: { type: string, format: date-time }
              example:
                items:
                  - { id: 44, status: PENDING, requested_at: "2026-09-30T14:34:00+09:00", counterpart_label: 101동 입주민, needed_at: "2026-09-30T15:00:00+09:00" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────── 공유 주차 (이용자) ─────────────────────────
  /garages:
    get:
      tags: [garages]
      summary: 👤 공유 주차 탐색 (#13)
      description: |
        **내 빌라와 같은 골목(alley)에 있는 다른 빌라의 차고지(주차장)** 에서 공개(`is_public=true`)된 공유 조건이 걸린 **칸** 을 하나씩 내려갑니다 (Figma: "햇살빌라 · P2").
        항목을 탭하면 `garage_id`(= 빌라 id) 로 차고지 상세를 엽니다.
        입주민 출차 시간 원본은 노출하지 않고 `estimated_free_at` 만 제공합니다.
        필터: `all`(전체) · `now`(즉시 가능) · `reservable`(예약 가능) · `free`(무료, 0토큰)
      operationId: listGarages
      x-priority: 2주차
      parameters:
        - { name: lat, in: query, schema: { type: number }, example: 37.62 }
        - { name: lng, in: query, schema: { type: number }, example: 127.06 }
        - { name: q, in: query, description: 주소·빌라명 검색, schema: { type: string }, example: 햇살 }
        - name: filter
          in: query
          schema: { type: string, enum: [all, now, reservable, free], default: all }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: 공유 칸 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageListPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /garages/{garage_id}:
    get:
      tags: [garages]
      summary: 👤 차고지 상세 (#14)
      description: |
        빌라 주차장(차고지)에서 공유 중인 칸과 칸별 공유 조건(`offer`)을 내려줍니다. 여러 주차 구역의 칸이 한 화면에 나옵니다 (예: 햇살빌라 P1 · P3 · P5).
        `garage_id` 는 빌라 id 입니다. 윗부분의 운영 시간·요금·최대 이용은 `summary` 로 내려갑니다.
        "요청하기" 는 고른 칸의 `offer.id` 로 `POST /share-requests` 를 호출합니다.
      operationId: getGarage
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/GarageId" }
      responses:
        "200":
          description: 차고지 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /share-requests:
    post:
      tags: [share-requests]
      summary: 👤 "요청하기" (#14 → #15)
      description: |
        공유 조건(`offer_id`) 하나에 날짜와 정시 단위 시간을 골라 요청합니다.
        - 이용료: `total_price = (end_hour - start_hour) × offer.hourly_price` **토큰**. 요청 시점 가격으로 고정됩니다
        - 요청 시 보유 토큰이 모자라면 409 `INSUFFICIENT_TOKENS`. **토큰은 수락될 때 빠져나갑니다** (요청만으로는 차감 없음)
        - 검증: 요일·운영시간·`max_hours` 이내여야 하고(400), 수락된 다른 요청과 시간이 겹치면 409 `GARAGE_TIME_CONFLICT`
        - 내가 연 공유 조건에는 요청할 수 없습니다 (400)
        - 관리인에게 `SHARE_REQUEST` 알림이 갑니다

        ⚠️ 와이어프레임에 이용 시간 선택 화면이 없습니다 (Notion 14-4). 날짜·시작·종료 시간 선택 바텀시트가 필요합니다.
      operationId: createShareRequest
      x-priority: 2주차
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRequestCreate" }
      responses:
        "201":
          description: 요청됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/ShareRequestStatus" }
                  total_price: { type: integer, description: 토큰 }
              example: { id: 301, status: PENDING, total_price: 6 }
        "400":
          description: 운영시간·요일·최대 이용 시간 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                outsideHours: { value: { error: { code: INVALID_INPUT, message: 운영 시간 밖입니다., detail: { start_hour: 7, end_hour: 23 } } } }
                exceedMaxHours: { value: { error: { code: INVALID_INPUT, message: 최대 이용 시간을 초과했습니다., detail: { max_hours: 4 } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 토큰 부족 / 시간 겹침
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                insufficientTokens:
                  summary: 토큰 부족 (제안 코드)
                  value: { error: { code: INSUFFICIENT_TOKENS, message: 토큰이 부족합니다., detail: { required: 6, balance: 4 } } }
                timeConflict:
                  value: { error: { code: GARAGE_TIME_CONFLICT, message: 요청한 시간에 이미 다른 예약이 있습니다., detail: null } }
  /share-requests/{share_request_id}:
    get:
      tags: [share-requests]
      summary: 👤 요청 결과 확인·수락·거절 안내 (#15~#17)
      description: FE 는 `status` 로 세 화면(요청 확인 중 / 수락됨 / 거절됨)을 분기합니다. 결과 알림(`SHARE_RESULT`) 탭 시에도 이 API 를 호출합니다.
      operationId: getShareRequest
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/ShareRequestId" }
      responses:
        "200":
          description: 요청 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareRequestDetail" }
              examples:
                pending:
                  summary: "#15 요청 확인 중"
                  value: { id: 301, status: PENDING, reject_reason: null, garage: { id: 4, name: 햇살빌라 }, slot_id: 2101, slot_label: P1, request_date: "2026-09-30", start_hour: 15, end_hour: 18, total_price: 6 }
                approved:
                  summary: "#16 요청 수락됨"
                  value: { id: 301, status: APPROVED, reject_reason: null, garage: { id: 4, name: 햇살빌라 }, slot_id: 2101, slot_label: P1, request_date: "2026-09-30", start_hour: 15, end_hour: 18, total_price: 6 }
                rejected:
                  summary: "#17 요청 거절됨"
                  value: { id: 301, status: REJECTED, reject_reason: 주차 구역 용량 초과, garage: { id: 4, name: 햇살빌라 }, slot_id: 2101, slot_label: P1, request_date: "2026-09-30", start_hour: 15, end_hour: 18, total_price: 6 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/share-requests:
    get:
      tags: [share-requests]
      summary: 👤 내 공유 요청 목록
      operationId: listMyShareRequests
      x-priority: 2주차
      responses:
        "200":
          description: 내가 보낸 요청
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ShareRequestDetail" }
              example:
                items:
                  - { id: 301, status: PENDING, reject_reason: null, garage: { id: 4, name: 햇살빌라 }, slot_id: 2101, slot_label: P1, request_date: "2026-09-30", start_hour: 15, end_hour: 18, total_price: 6 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────── 관리인 ─────────────────────────
  /admin/buildings/{building_id}/dashboard:
    get:
      tags: [admin]
      summary: 🛠 관리자 대시보드 (#18)
      description: |
        - `congestion.days[].peak_occupied` 는 하루 중 가장 붐빈 시간의 점유 칸 수입니다 (총 8칸)
        - `ai_insight` 는 향후 기능이라 지금은 항상 `null` 입니다 (FE 는 "AI 분석 (향후)" 카드를 고정 표시)
        - 요청자 이름은 `박○○` 처럼 마스킹됩니다
      operationId: getAdminDashboard
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          example: "2026-09"
      responses:
        "200":
          description: 대시보드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
  /admin/share-requests/{share_request_id}:
    patch:
      tags: [admin]
      summary: 🛠 공유 요청 수락 / 거절 (#18, #21)
      description: |
        **수락하면 `total_price` 토큰이 요청자에게서 공유 조건을 연 관리인(`host`)에게 넘어가고** `token_transfers` 에 기록됩니다. 무료(0토큰)면 이동이 없습니다.
        수락 시점에 요청자 토큰이 모자라면 409 `INSUFFICIENT_TOKENS` 이고 요청은 `PENDING` 으로 남습니다.
        요청자에게 `SHARE_RESULT` 알림이 갑니다. 거절 사유 프리셋(`주차 구역 용량 초과` · `시간 불가` · `기타`)은 제안 15-3 입니다 (Figma 요청 거절 화면 문구 기준).
      operationId: decideShareRequest
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/ShareRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
                reject_reason: { type: [string, "null"] }
            examples:
              approve: { summary: 수락, value: { status: APPROVED } }
              reject: { summary: 거절, value: { status: REJECTED, reject_reason: 주차 구역 용량 초과 } }
      responses:
        "200":
          description: 처리됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { $ref: "#/components/schemas/ShareRequestStatus" }
                  reject_reason: { type: [string, "null"] }
                  responded_at: { type: string, format: date-time }
              example: { id: 301, status: REJECTED, reject_reason: 주차 구역 용량 초과, responded_at: "2026-09-30T14:45:00+09:00" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 시간 겹침 / 이미 처리됨 / 요청자 토큰 부족
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                insufficientTokens: { summary: 요청자 토큰 부족 (제안 코드), value: { error: { code: INSUFFICIENT_TOKENS, message: 요청자의 토큰이 부족합니다., detail: { required: 8, balance: 4 } } } }
                conflict: { value: { error: { code: GARAGE_TIME_CONFLICT, message: 이미 수락된 다른 예약과 시간이 겹칩니다., detail: null } } }
                decided: { value: { error: { code: ALREADY_DECIDED, message: 이미 처리된 요청입니다., detail: { status: APPROVED } } } }
  /admin/buildings/{building_id}/share-requests:
    get:
      tags: [admin]
      summary: 🛠 공유 요청 관리 (#21)
      operationId: listAdminShareRequests
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
        - name: status
          in: query
          schema: { type: string, enum: [all, PENDING, APPROVED, REJECTED], default: all }
        - { name: q, in: query, description: 요청자 또는 차량번호 검색, schema: { type: string }, example: 홍길동 }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: 요청 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminShareRequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
  /admin/buildings/{building_id}/slots:
    get:
      tags: [admin]
      summary: 🛠 주차 구역 설정 목록 (#19)
      description: "주차 구역·칸 추가·삭제는 운영팀 전용이라 관리인 API 가 없습니다. `share_offer_id` 가 있으면 공유 조건이 걸린 칸입니다."
      operationId: listAdminSlots
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
      responses:
        "200":
          description: 칸 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminSlot" }
              example:
                items:
                  - { slot_id: 1001, zone_id: 10, number: 1, label: P1, is_active: true, occupied: true, share_offer_id: null }
                  - { slot_id: 1002, zone_id: 10, number: 2, label: P2, is_active: true, occupied: true, share_offer_id: null }
                  - { slot_id: 1003, zone_id: 11, number: 1, label: P3, is_active: true, occupied: true, share_offer_id: 401 }
                  - { slot_id: 1004, zone_id: 12, number: 1, label: P4, is_active: true, occupied: true, share_offer_id: null }
                  - { slot_id: 1005, zone_id: 12, number: 2, label: P5, is_active: false, occupied: false, share_offer_id: null }
                  - { slot_id: 1006, zone_id: 12, number: 3, label: P6, is_active: true, occupied: true, share_offer_id: null }
                  - { slot_id: 1007, zone_id: 13, number: 1, label: P7, is_active: true, occupied: false, share_offer_id: 402 }
                  - { slot_id: 1008, zone_id: 13, number: 2, label: P8, is_active: true, occupied: false, share_offer_id: null }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
  /admin/slots/{slot_id}:
    patch:
      tags: [admin]
      summary: 🛠 칸 설정 모달 (#19)
      description: "`is_active=false` 면 배치도에서 선택할 수 없습니다(`UNAVAILABLE`). DB 는 칸을 지우지 않고 비활성화합니다. 공유 여부는 여기서 바꾸지 않고 공유 조건 API 로 등록·삭제합니다."
      operationId: updateAdminSlot
      x-priority: 2주차
      parameters:
        - { name: slot_id, in: path, required: true, schema: { type: integer }, example: 1005 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active: { type: boolean }
            example: { is_active: false }
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSlot" }
              example: { slot_id: 1005, zone_id: 12, number: 2, label: P5, is_active: false, occupied: false, share_offer_id: null }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/buildings/{building_id}/share-offers:
    get:
      tags: [admin]
      summary: 🛠 등록한 공유 조건 목록
      description: 이 빌라의 칸에 걸린 공유 조건(DB `share_offers`)입니다. 칸 하나에 기간별로 여러 개를 둘 수 있습니다.
      operationId: listAdminShareOffers
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
      responses:
        "200":
          description: 공유 조건 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ShareOffer" }
              example:
                items:
                  - { id: 401, slot_id: 1003, slot_label: P3, host_id: 2, weekdays: [MON, TUE, WED, THU, FRI, SAT, SUN], start_hour: 7, end_hour: 23, hourly_price: 2, max_hours: 4, memo: 이용 후 칸 비워주세요, is_public: true }
                  - { id: 402, slot_id: 1007, slot_label: P7, host_id: 2, weekdays: [MON, TUE, WED, THU, FRI, SAT, SUN], start_hour: 7, end_hour: 23, hourly_price: 2, max_hours: 4, memo: 이용 후 칸 비워주세요, is_public: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
    post:
      tags: [admin]
      summary: 🛠 차고지 등록 = 고른 칸들에 공유 조건 등록 (#20)
      description: |
        차고지는 빌라의 주차장이라 이미 있습니다. "차고지 등록" 은 **공유할 칸을 고르고 조건을 거는 것**이며, DB 에는 칸마다 공유 조건(`share_offers`)이 하나씩 생깁니다.
        - Figma 처럼 칸을 여러 개 고르면 `slot_ids` 로 한 번에 보냅니다. 응답은 만들어진 공유 조건 목록입니다 (하나라도 실패하면 전부 취소)
        - `host` 는 호출한 관리인이며, 수락된 요청의 토큰을 받습니다
        - 와이어프레임 입력 중 가용 시간(시작·종료, **정시 단위**), 요일, 시간당 요금(0이면 무료), 최대 이용 시간(제한 없음 = `null`), 메모, 공개 여부를 받습니다. 이름·상세 위치 안내는 DB 에 없어 받지 않습니다 (열린 질문 #12)
        - 시작일·종료일 입력은 없습니다. 등록하면 그날부터 무기한 공유되고, 멈추려면 `is_public=false` 로 바꿉니다
        - 비활성(`is_active=false`) 칸이나 다른 빌라의 칸이면 400
      operationId: createAdminShareOffer
      x-priority: 2주차
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareOfferCreate" }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ShareOffer" }
              example:
                items:
                  - { id: 401, slot_id: 1003, slot_label: P3, host_id: 2, weekdays: [MON, TUE, WED, THU, FRI, SAT, SUN], start_hour: 7, end_hour: 23, hourly_price: 2, max_hours: 4, memo: 이용 후 칸 비워주세요, is_public: true }
                  - { id: 402, slot_id: 1007, slot_label: P7, host_id: 2, weekdays: [MON, TUE, WED, THU, FRI, SAT, SUN], start_hour: 7, end_hour: 23, hourly_price: 2, max_hours: 4, memo: 이용 후 칸 비워주세요, is_public: true }
        "400":
          description: 검증 실패 (비활성 칸·다른 빌라 칸·시간 범위 오류 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: INVALID_INPUT, message: 사용 중지된 칸은 공유할 수 없습니다., detail: { slot_id: 1005 } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
  /admin/share-offers/{offer_id}:
    parameters:
      - { $ref: "#/components/parameters/OfferId" }
    patch:
      tags: [admin]
      summary: 🛠 공유 조건 수정
      description: "`is_public=false` 로 바꾸면 공유를 중단합니다. 가격을 바꿔도 이미 들어온 요청의 `total_price` 는 그대로입니다."
      operationId: updateAdminShareOffer
      x-priority: 2주차
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareOfferUpdate" }
            example: { hourly_price: 3, is_public: false }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareOffer" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      summary: 🛠 공유 조건 삭제
      description: 이 조건에 딸린 공유 요청도 함께 지워집니다 (DB `ON DELETE CASCADE`). 기록을 남기려면 삭제 대신 `is_public=false` 를 쓰세요.
      operationId: deleteAdminShareOffer
      x-priority: 2주차
      responses:
        "204": { description: 삭제됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/buildings/{building_id}/unknown-vehicles:
    post:
      tags: [admin]
      summary: 🛠 미확인 차량 등록 (향후)
      description: |
        앱 미가입 차량을 관리인이 번호판만 등록합니다. 배치도·추천에서 `occupant_type=UNKNOWN` 이고 출차 시간이 없어 막힘 위험으로 계산합니다.
        이동 요청은 불가합니다 ("앱으로 연락 불가").
      operationId: createUnknownVehicle
      x-priority: 향후
      parameters:
        - { $ref: "#/components/parameters/BuildingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id, plate]
              properties:
                slot_id: { type: integer }
                plate: { type: string }
            example: { slot_id: 1006, plate: 45다6789 }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  parking_id: { type: integer }
                  vehicle_id: { type: integer }
                  occupant_type: { $ref: "#/components/schemas/OccupantType" }
              example: { parking_id: 559, vehicle_id: 31, occupant_type: UNKNOWN }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotBuildingAdmin" }
        "409":
          description: 사용 중인 칸
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: SLOT_OCCUPIED, message: 이미 다른 차량이 주차 중인 칸입니다., detail: null } }

  # ───────────────────────── 알림 ─────────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: 👤 알림 목록
      description: "`link` 로 FE 가 해당 화면(이동 요청 수신 #12, 요청 결과 #15 등)으로 이동합니다."
      operationId: listNotifications
      x-priority: 1주차
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: 알림 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/{notification_id}/read:
    post:
      tags: [notifications]
      summary: 👤 알림 읽음 처리 (홈 "확인" 버튼)
      operationId: readNotification
      x-priority: 1주차
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer }, example: 91 }
      responses:
        "204": { description: 읽음 처리됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: 👤 전체 읽음 처리
      operationId: readAllNotifications
      x-priority: 1주차
      responses:
        "204": { description: 모두 읽음 처리됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /health:
    get:
      tags: [health]
      summary: 🔓 상태 확인
      description: "`/api/v1` 접두사가 붙지 않는 `/health` 입니다."
      operationId: health
      security: []
      servers:
        - url: http://localhost:8000
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
              example: { status: ok }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BuildingId: { name: building_id, in: path, required: true, schema: { type: integer }, example: 3 }
    VehicleId: { name: vehicle_id, in: path, required: true, schema: { type: integer }, example: 7 }
    ParkingId: { name: parking_id, in: path, required: true, schema: { type: integer }, example: 556 }
    MoveRequestId: { name: move_request_id, in: path, required: true, schema: { type: integer }, example: 44 }
    GarageId: { name: garage_id, in: path, required: true, description: 차고지 id = 빌라 id, schema: { type: integer }, example: 4 }
    ShareRequestId: { name: share_request_id, in: path, required: true, schema: { type: integer }, example: 301 }
    OfferId: { name: offer_id, in: path, required: true, schema: { type: integer }, example: 401 }
    Cursor: { name: cursor, in: query, required: false, description: 이전 응답의 next_cursor, schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }

  responses:
    InvalidInput:
      description: 검증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: INVALID_INPUT, message: 입력값이 올바르지 않습니다., detail: { field: agree_terms, reason: 이용약관에 동의해야 합니다. } } }
    Unauthorized:
      description: 토큰 없음·만료
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: UNAUTHORIZED, message: 로그인이 필요합니다., detail: null } }
    NotBuildingMember:
      description: 해당 빌라 입주민이 아님
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: NOT_BUILDING_MEMBER, message: 이 빌라의 입주민만 이용할 수 있습니다., detail: null } }
    NotBuildingAdmin:
      description: 해당 빌라 관리인이 아님
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: NOT_BUILDING_ADMIN, message: 이 빌라의 관리인만 이용할 수 있습니다., detail: null } }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: NOT_FOUND, message: 대상을 찾을 수 없습니다., detail: null } }

  schemas:
    # ── 공통 ──
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            detail: { type: [object, "null"], additionalProperties: true }
    ErrorCode:
      type: string
      description: |
        400 `INVALID_INPUT` · 401 `UNAUTHORIZED` `INVALID_CREDENTIALS` · 403 `NOT_BUILDING_MEMBER` `NOT_BUILDING_ADMIN` ·
        404 `NOT_FOUND` `INVALID_INVITE_CODE` · 409 `CONFLICT`(범용, 현재 상태와 충돌) `EMAIL_EXISTS` `SLOT_OCCUPIED` `SLOT_UNAVAILABLE` `VEHICLE_ALREADY_PARKED` `GARAGE_TIME_CONFLICT`.
        **제안(v0.2 미정의)**: `PLATE_EXISTS` `ALREADY_DECIDED` `MOVE_REQUEST_ALREADY_PENDING` `ALREADY_IN_BUILDING` `INSUFFICIENT_TOKENS` (모두 409)
      enum:
        - INVALID_INPUT
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - NOT_BUILDING_MEMBER
        - NOT_BUILDING_ADMIN
        - NOT_FOUND
        - INVALID_INVITE_CODE
        - CONFLICT
        - EMAIL_EXISTS
        - SLOT_OCCUPIED
        - SLOT_UNAVAILABLE
        - VEHICLE_ALREADY_PARKED
        - GARAGE_TIME_CONFLICT
        - PLATE_EXISTS
        - ALREADY_DECIDED
        - MOVE_REQUEST_ALREADY_PENDING
        - ALREADY_IN_BUILDING
        - INSUFFICIENT_TOKENS
    Weekday:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    TimeOfDay:
      type: string
      pattern: '^\d{2}:\d{2}$'
      description: 시각만 표기 ("07:30")

    # ── Enum ──
    BuildingRole: { type: string, enum: [RESIDENT, ADMIN], description: "입주민 / 관리인. DB 는 residents.role 의 RESIDENT / MANAGER" }
    ZoneType:
      type: string
      enum: [PILOTI_IN, PILOTI_OUT, ROADSIDE]
      description: 주차 구역 유형. 필로티 내부 / 필로티 외부·건물 앞 / 골목 노상 (DB garage_type)
    Hour: { type: integer, minimum: 0, maximum: 24, description: "정시 단위 시각. 24 = 자정" }
    AlleyRef:
      type: object
      description: 골목. 최상위 운영 단위로 같은 골목의 빌라끼리 차고지를 공유
      properties:
        id: { type: integer }
        name: { type: string }
    OnboardingStep: { type: string, enum: [JOIN_BUILDING, REGISTER_VEHICLE, DONE] }
    SlotState:
      type: string
      enum: [EMPTY, SOON_EXIT, OCCUPIED, UNAVAILABLE]
      description: 배치도 표시 (EMPTY 빈칸 · SOON_EXIT 곧 출차 · OCCUPIED 사용 중 · UNAVAILABLE 사용 불가)
    SlotTag: { type: string, enum: [RECOMMENDED, EMPTY, OCCUPIED, UNAVAILABLE], description: "배치 추천 태그. RECOMMENDED 는 응답에 최대 1개 (열린 질문 19)" }
    OccupantType:
      type: string
      enum: [RESIDENT, EXTERNAL, UNKNOWN]
      description: 입주민 차량 / 외부·공유 이용자 / 미확인
    ExitSource:
      type: string
      enum: [MANUAL, RECURRING, AI_ESTIMATED, NONE]
      description: 직접 / 반복 / AI 추정(향후) / 없음(상시 주차 등)
    ParkingState: { type: string, enum: [PARKED, EXITED], description: "Notion Enum 표에 없어 Mock 에서 정의" }
    VehicleStatus: { type: string, enum: [PARKED, OUT], description: "PARKED 주차 중 / OUT 외부 출차. Notion Enum 표에 없어 Mock 에서 정의" }
    MoveRequestStatus: { type: string, enum: [PENDING, MOVED, DECLINED], description: "DB move_request_status 와 같음. MOVED = 옮겼어요, DECLINED 는 화면 없음" }
    GarageAvailability: { type: string, enum: [AVAILABLE, SOON_EXIT, RESERVABLE, UNAVAILABLE] }
    GarageSlotState: { type: string, enum: [AVAILABLE, SOON_EXIT, IN_USE], description: "차고지 상세(#14) 칸 상태. Notion Enum 표에 없어 Mock 에서 정의" }
    ShareRequestStatus: { type: string, enum: [PENDING, APPROVED, REJECTED], description: "DB 는 PENDING / ACCEPTED / REJECTED" }
    NotificationType:
      type: string
      enum: [BLOCK_ALERT, MOVE_REQUEST, EXIT_DONE, SHARE_REQUEST, SHARE_RESULT]
      description: |
        와이어프레임에 나오는 알림만 둡니다.
        `BLOCK_ALERT` 막힘 알림(전날 밤 사전 알림 포함, 홈 막힘 카드) · `MOVE_REQUEST` 이동 요청 도착 ·
        `EXIT_DONE` 출차 완료 안내 · `SHARE_REQUEST` 공유 사용 요청(관리인) · `SHARE_RESULT` 공유 요청 수락/거절 결과.
        DB `notification_type` 과 같음 (마이그레이션 0004)
    VehicleColor: { type: string, enum: [검정, 흰색, 은색, 회색, 파랑, 빨강, 기타] }

    # ── 인증 · 사용자 ──
    SignupRequest:
      type: object
      required: [email, password, nickname, agree_terms]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        nickname: { type: string }
        agree_terms: { type: boolean }
      example: { email: kim@kw.ac.kr, password: "********", nickname: 지수, agree_terms: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      example: { email: kim@kw.ac.kr, password: "********" }
    AuthTokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            onboarding_step: { $ref: "#/components/schemas/OnboardingStep" }
      example:
        access_token: eyJhbGciOiJIUzI1NiJ9.access
        refresh_token: eyJhbGciOiJIUzI1NiJ9.refresh
        user: { id: 1, nickname: 지수, onboarding_step: JOIN_BUILDING }
    UserMe:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        nickname: { type: string }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"], description: 본인에게도 마스킹 }
        temperature: { type: number, description: "차곡이 온도(매너 온도). 기본 36.5" }
        token_balance: { type: integer, minimum: 0, description: 보유 토큰. 공유 이용료는 토큰으로만 주고받음 }
        onboarding_step: { $ref: "#/components/schemas/OnboardingStep" }
        building:
          type: [object, "null"]
          description: 소속 빌라. **한 사용자는 한 빌라에만 소속**되므로 배열이 아니라 단일 객체. 합류 전이면 null
          properties:
            building_id: { type: integer }
            name: { type: string }
            alley: { $ref: "#/components/schemas/AlleyRef" }
            role: { $ref: "#/components/schemas/BuildingRole" }
            unit: { type: [string, "null"] }
      example:
        id: 1
        email: kim@kw.ac.kr
        nickname: 지수
        name: 김지수
        phone: 010-****-5678
        temperature: 36.5
        token_balance: 30
        onboarding_step: DONE
        building: { building_id: 3, name: 월계 한빛빌라, alley: { id: 1, name: 광운로19가길 }, role: RESIDENT, unit: 101동 202호 }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        unit: { type: string }
        phone: { type: string }
      example: { name: 김지수, unit: 101동 202호, phone: 010-1234-5678 }

    # ── 배치도 · 현황 · 홈 ──
    BuildingLayout:
      type: object
      description: 골목 > 빌라(차고지) > 주차 구역 > 칸 (DB 계층 그대로)
      properties:
        building_id: { type: integer }
        name: { type: string }
        alley: { $ref: "#/components/schemas/AlleyRef" }
        zones:
          type: array
          description: 주차 구역 (DB garages), sort_order 순
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string, description: 빌라 안에서 유일 }
              zone_type: { $ref: "#/components/schemas/ZoneType" }
              sort_order: { type: integer }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    number: { type: integer, minimum: 1, description: 주차 구역 안 번호 (구역 안에서 유일) }
                    label: { type: string, description: "칸 이름. 빌라 안 순번 P1, P2 … (주차 구역 sort_order → number 순)" }
                    front_slot_id: { type: [integer, "null"], description: 이 칸 바로 앞(출구 쪽) 칸. 없으면 null }
                    is_active: { type: boolean, description: false 면 사용 불가 칸 }
                    rect:
                      type: [object, "null"]
                      description: 건물 기준 로컬 좌표(미터). DB render_x0..y1
                      properties:
                        x0: { type: number }
                        y0: { type: number }
                        x1: { type: number }
                        y1: { type: number }
      example:
        building_id: 3
        name: 월계 한빛빌라
        alley: { id: 1, name: 광운로19가길 }
        zones:
          - id: 10
            name: 필로티 안쪽
            zone_type: PILOTI_IN
            sort_order: 0
            slots:
              - { id: 1001, number: 1, label: P1, front_slot_id: 1002, is_active: true, rect: { x0: 4.0, y0: 0.0, x1: 6.5, y1: 5.0 } }
              - { id: 1002, number: 2, label: P2, front_slot_id: null, is_active: true, rect: { x0: 4.0, y0: 5.0, x1: 6.5, y1: 10.0 } }
          - id: 11
            name: 필로티 외부
            zone_type: PILOTI_OUT
            sort_order: 1
            slots:
              - { id: 1003, number: 1, label: P3, front_slot_id: null, is_active: true, rect: { x0: 7.0, y0: 0.0, x1: 9.5, y1: 5.0 } }
          - id: 12
            name: 건물 앞
            zone_type: PILOTI_OUT
            sort_order: 2
            slots:
              - { id: 1004, number: 1, label: P4, front_slot_id: 1005, is_active: true, rect: { x0: 0.0, y0: 11.0, x1: 2.5, y1: 16.0 } }
              - { id: 1005, number: 2, label: P5, front_slot_id: null, is_active: false, rect: { x0: 0.0, y0: 16.0, x1: 2.5, y1: 21.0 } }
              - { id: 1006, number: 3, label: P6, front_slot_id: null, is_active: true, rect: { x0: 3.0, y0: 11.0, x1: 5.5, y1: 16.0 } }
          - id: 13
            name: 골목
            zone_type: ROADSIDE
            sort_order: 3
            slots:
              - { id: 1007, number: 1, label: P7, front_slot_id: 1008, is_active: true, rect: { x0: 10.0, y0: 11.0, x1: 12.5, y1: 16.0 } }
              - { id: 1008, number: 2, label: P8, front_slot_id: null, is_active: true, rect: { x0: 10.0, y0: 16.0, x1: 12.5, y1: 21.0 } }
    SlotStatus:
      type: object
      properties:
        slot_id: { type: integer }
        state: { $ref: "#/components/schemas/SlotState" }
        parking:
          type: [object, "null"]
          properties:
            id: { type: integer }
            is_mine: { type: boolean }
            plate: { type: string }
            occupant_type: { $ref: "#/components/schemas/OccupantType" }
            expected_exit_at: { type: [string, "null"], format: date-time }
            exit_source: { $ref: "#/components/schemas/ExitSource" }
        blocked_by: { type: array, items: { type: integer }, description: 이 칸의 차를 막고 있는 칸 }
        blocking: { type: array, items: { type: integer }, description: 이 칸의 차가 막고 있는 칸 }
    BuildingStatus:
      type: object
      properties:
        updated_at: { type: string, format: date-time }
        slots:
          type: array
          items: { $ref: "#/components/schemas/SlotStatus" }
      example:
        updated_at: "2026-09-30T14:40:00+09:00"
        slots:
          - { slot_id: 1001, state: OCCUPIED, parking: { id: 556, is_mine: true, plate: 12가 3456, occupant_type: RESIDENT, expected_exit_at: "2026-09-30T18:30:00+09:00", exit_source: MANUAL }, blocked_by: [1002], blocking: [] }
          - { slot_id: 1002, state: OCCUPIED, parking: { id: 555, is_mine: false, plate: 34나 5678, occupant_type: RESIDENT, expected_exit_at: "2026-09-30T21:00:00+09:00", exit_source: MANUAL }, blocked_by: [], blocking: [1001] }
          - { slot_id: 1003, state: OCCUPIED, parking: { id: 558, is_mine: false, plate: 123가 4634, occupant_type: EXTERNAL, expected_exit_at: "2026-09-30T17:00:00+09:00", exit_source: NONE }, blocked_by: [], blocking: [] }
          - { slot_id: 1004, state: SOON_EXIT, parking: { id: 557, is_mine: false, plate: 27가 4821, occupant_type: RESIDENT, expected_exit_at: "2026-09-30T15:10:00+09:00", exit_source: RECURRING }, blocked_by: [], blocking: [] }
          - { slot_id: 1005, state: UNAVAILABLE, parking: null, blocked_by: [], blocking: [] }
          - { slot_id: 1006, state: OCCUPIED, parking: { id: 559, is_mine: false, plate: 45다 6789, occupant_type: UNKNOWN, expected_exit_at: null, exit_source: NONE }, blocked_by: [], blocking: [] }
          - { slot_id: 1007, state: EMPTY, parking: null, blocked_by: [], blocking: [] }
          - { slot_id: 1008, state: EMPTY, parking: null, blocked_by: [], blocking: [] }
    Home:
      type: object
      properties:
        building:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            role: { $ref: "#/components/schemas/BuildingRole" }
        unread_notification_count: { type: integer }
        summary:
          type: object
          properties:
            available: { type: integer, description: 가능 = 빈칸 + 1시간 내 비는 칸 }
            soon_exit: { type: integer }
            blocked: { type: integer }
            empty: { type: integer }
        my_parking:
          type: [object, "null"]
          properties:
            parking_id: { type: integer }
            vehicle:
              type: object
              properties:
                id: { type: integer }
                plate: { type: string }
                color: { type: [string, "null"] }
            slot_label: { type: string }
            state: { $ref: "#/components/schemas/ParkingState" }
            expected_exit_at: { type: [string, "null"], format: date-time }
        block_alert:
          type: [object, "null"]
          properties:
            blocking_parking_id: { type: integer }
            message: { type: string }
        admin:
          type: [object, "null"]
          description: 관리인일 때만 포함
          properties:
            pending_share_requests: { type: integer }
        recent_notifications:
          type: array
          items: { $ref: "#/components/schemas/NotificationItem" }
      example:
        building: { id: 3, name: 월계 한빛빌라, role: RESIDENT }
        unread_notification_count: 2
        summary: { available: 3, soon_exit: 1, blocked: 1, empty: 2 }
        my_parking:
          parking_id: 556
          vehicle: { id: 7, plate: 12가 3456, color: 흰색 }
          slot_label: P1
          state: PARKED
          expected_exit_at: "2026-09-30T18:30:00+09:00"
        block_alert: { blocking_parking_id: 555, message: 내 차량이 P2 차량에 의해 막혀 있습니다. }
        admin: null
        recent_notifications:
          - { id: 91, type: MOVE_REQUEST, title: 주차 요청 도착, body: 101동 입주민, link: { screen: MOVE_REQUEST, id: 44 }, is_read: false, created_at: "2026-09-30T14:39:00+09:00" }
          - { id: 90, type: EXIT_DONE, title: 출차 완료 안내, body: P4 비어 있음, link: null, is_read: false, created_at: "2026-09-30T14:30:00+09:00" }

    # ── 차량 ──
    VehicleListItem:
      type: object
      properties:
        id: { type: integer }
        plate: { type: string }
        alias: { type: [string, "null"] }
        color: { oneOf: [{ $ref: "#/components/schemas/VehicleColor" }, { type: "null" }] }
        is_default: { type: boolean }
        status: { $ref: "#/components/schemas/VehicleStatus" }
        status_text: { type: string }
    VehicleCreate:
      type: object
      required: [plate]
      properties:
        plate: { type: string, examples: ["12가3456"] }
        color: { $ref: "#/components/schemas/VehicleColor" }
        alias: { type: string }
        is_default: { type: boolean, default: false }
    VehicleUpdate:
      type: object
      properties:
        plate: { type: string }
        alias: { type: string }
        is_default: { type: boolean }
    VehicleDetail:
      type: object
      properties:
        id: { type: integer }
        plate: { type: string }
        color: { type: [string, "null"] }
        owner: { type: object, properties: { name: { type: string }, unit: { type: string } } }
        parking:
          type: [object, "null"]
          properties:
            parking_id: { type: integer }
            slot_id: { type: integer }
            slot_label: { type: string }
            entered_at: { type: string, format: date-time }
            state: { $ref: "#/components/schemas/ParkingState" }
        schedule:
          type: [object, "null"]
          properties:
            expected_exit_at: { type: [string, "null"], format: date-time }
            exit_source: { $ref: "#/components/schemas/ExitSource" }
            elapsed_minutes: { type: integer, description: 입차 후 경과 시간(분) }
    RecurringSchedule:
      type: object
      required: [days, time]
      properties:
        days:
          type: array
          items: { $ref: "#/components/schemas/Weekday" }
        time: { $ref: "#/components/schemas/TimeOfDay" }
        memo: { type: [string, "null"] }
      example: { days: [MON, TUE, WED, THU, FRI], time: "07:30", memo: 출근 일정 }

    # ── 주차 배치 ──
    SlotRecommendation:
      type: object
      properties:
        slot_id: { type: integer }
        tag: { $ref: "#/components/schemas/SlotTag" }
        label: { type: string }
        reason: { type: string, description: "RECOMMENDED 일 때만. 추천 이유" }
        will_block: { type: array, items: { type: integer }, description: "EMPTY 일 때만. 이 칸에 두면 막게 되는 칸 id" }
        unavailable_reason: { type: string, description: "UNAVAILABLE 일 때만" }
    ParkingCreate:
      type: object
      required: [slot_id, vehicle_id]
      properties:
        slot_id: { type: integer }
        vehicle_id: { type: integer }
        is_long_term: { type: boolean, default: false, description: 상시 주차 }
        expected_exit_at: { type: string, format: date-time }
        repeat_weekdays:
          type: boolean
          default: false
          description: "평일(월~금) 반복 등록 여부. ⚠️ 이름은 복수형이지만 boolean (요일 직접 선택은 #9 API)"
        memo: { type: string }
    ParkingCreated:
      type: object
      properties:
        id: { type: integer }
        slot_id: { type: integer }
        state: { $ref: "#/components/schemas/ParkingState" }
        expected_exit_at: { type: [string, "null"], format: date-time }
        exit_source: { $ref: "#/components/schemas/ExitSource" }
        blocking: { type: array, items: { type: integer }, description: 이 배치로 막게 되는 칸 }

    # ── 이동 요청 ──
    MoveRequestDetail:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/MoveRequestStatus" }
        requested_at: { type: string, format: date-time }
        requester: { type: object, properties: { label: { type: string } } }
        my_vehicle:
          type: object
          properties:
            plate: { type: string }
            slot_label: { type: string }
            parked_at: { type: string, format: date-time }
        blocked_vehicle:
          type: object
          properties:
            plate: { type: string }
            slot_label: { type: string }
            needed_at: { type: string, format: date-time }
        reason: { type: [string, "null"] }
      example:
        id: 44
        status: PENDING
        requested_at: "2026-09-30T14:34:00+09:00"
        requester: { label: 101동 입주민 }
        my_vehicle: { plate: 34나 5678, slot_label: P2, parked_at: "2026-09-30T12:10:00+09:00" }
        blocked_vehicle: { plate: 12가 3456, slot_label: P1, needed_at: "2026-09-30T15:00:00+09:00" }
        reason: 외출 예정으로 출차가 필요합니다. 차량 이동을 부탁드립니다.

    # ── 공유 주차 (이용자) ──
    GarageListItem:
      type: object
      description: 공유 칸 하나 (Figma "햇살빌라 · P2")
      properties:
        garage_id: { type: integer, description: 차고지 id = 빌라 id }
        building_name: { type: string }
        slot_id: { type: integer }
        slot_label: { type: string, description: "칸 이름. 빌라 안 순번 P1, P2 … (주차 구역 sort_order → number 순)" }
        title: { type: string, description: "목록 표시용 (빌라 이름 · 칸 이름)" }
        availability: { $ref: "#/components/schemas/GarageAvailability" }
        hourly_price: { type: integer, description: "시간당 토큰. 0 = 무료" }
        info: { type: [string, "null"], description: 목록 보조 문구 }
        estimated_free_at: { type: [string, "null"], format: date-time }
        estimate_source: { oneOf: [{ $ref: "#/components/schemas/ExitSource" }, { type: "null" }] }
        available_from: { type: [string, "null"], format: date-time }
        max_hours: { type: [integer, "null"] }
        weekdays_only: { type: boolean }
    GarageListPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GarageListItem" }
        next_cursor: { type: [string, "null"] }
      example:
        items:
