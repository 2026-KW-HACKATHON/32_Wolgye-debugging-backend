        관리인/입주민 초대코드를 따로 두면 `role` 을 코드로 결정할 수 있습니다 (제안 15-1).

        **한 사용자는 한 빌라에만 소속됩니다.** 이미 빌라에 소속된 사용자가 호출하면 같은 빌라든 다른 빌라든 409 `ALREADY_IN_BUILDING` 입니다.
