          - { garage_id: 5, building_name: 초록빌라, slot_id: 2201, slot_label: P1, title: 초록빌라 · P1, availability: SOON_EXIT, hourly_price: 2, estimated_free_at: "2026-09-30T15:30:00+09:00", estimate_source: AI_ESTIMATED }
