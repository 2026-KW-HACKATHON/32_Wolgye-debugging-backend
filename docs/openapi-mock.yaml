openapi: 3.1.0
info:
  title: 차곡차곡 API v0.2 (Mock 명세)
  version: 0.2.0-mock
  description: |
    빌라 골목 주차 공유 앱 **차곡차곡**의 API 명세(v0.2)입니다. 프런트가 서버 없이 화면을 만들 수 있도록 **예시 값은 모두 가짜(Mock) 데이터**로 채웠습니다.

    ### 기준 문서
    - **Figma "월계디버깅 / 와이어프레임" 페이지가 기준**입니다 (문구·선택지·화면 흐름). Manyfast 와이어프레임 23개 화면은 같은 화면의 이전본이고, 요구사항(PRD)은 Manyfast 를 참고합니다.
    - Notion "차곡차곡 API 명세 v0.2" 는 **임시 API 명세**입니다 (엔드포인트·필드·에러 코드 초안). Figma 와 다르면 Figma 를 따릅니다. 화면 번호 #1~#23 은 Notion 의 "화면 → API 매핑" 번호와 같습니다.
    - **DB 에 저장할 곳이 없는 기능은 API 로 만들지 않습니다** (알림 설정, Web Push 구독, 로그아웃, 공유 요청 취소, 미확인 차량 메모, 긴급 이동 요청 등).

    - 현재 DB 스키마 (`app/models/`). 아래 네 가지는 Notion v0.2 대신 **DB 를 따릅니다**.

    ### Notion v0.2 와 다르게 정한 것 (DB 기준)
    | 항목 | Notion v0.2 | 이 명세 (DB 기준) |
    |---|---|---|
    | 결제 | 원 | **토큰**. `residents.token_balance` 로 보유, 수락 시 요청자 → 공유를 연 관리인에게 이동 (`token_transfers`) |
    | 차고지(Garage) | 관리인이 등록하는 공유 상품 (칸 묶음 + 시간 + 요금) | **빌라의 주차장**. 빌라 하나에 차고지 하나라서 API 의 `garage_id` 는 빌라 id 와 같음. 시간·토큰 가격은 칸마다 따로 두는 **공유 조건** (`share_offers`) 에 있음 |
    | 계층 | Building > Zone > Lane > Slot (`depth`) | **골목(Alley) > 빌라(Building) = 차고지 > 주차 구역(Zone) > 칸(Slot)**. 주차 구역은 필로티 안쪽·건물 앞·골목 같은 묶음 (DB 테이블 이름은 `garages`). 막힘은 `front_slot_id` 로 계산 |
    | 사용자–빌라 | 여러 빌라 소속 가능 (`BuildingMember`) | **한 사용자는 한 빌라에만 소속** (`residents.building_id`). 이미 소속된 사용자가 합류하면 409 |

    > ⚠️ **현재 서버 구현과도 다릅니다.** 인증·경로·응답 모양은 설계(목표) 기준입니다. 이전에 만든 "현재 구현 기준" 명세(`/alleys`, `/share-offers` 등)는 git 이력(PR #1)에 있습니다.

    ### 공통 규칙
    | 항목 | 규칙 |
    |---|---|
    | 인증 | `Authorization: Bearer <access_token>` (`🔓` 표시 엔드포인트는 불필요) |
    | 시간 | ISO 8601 + KST (`2026-09-30T14:40:00+09:00`), 시각만은 `"07:30"` |
    | 공유 시간 | 날짜(`2026-09-30`) + **정시 단위** `start_hour`/`end_hour` (0~24, 24 = 자정). DB 가 정시 단위로 저장 |
    | 요일 | `MON` `TUE` `WED` `THU` `FRI` `SAT` `SUN` (DB 는 0=월 ~ 6=일) |
    | 금액 | 정수(**토큰**). 원 결제는 없음 |
    | 페이지네이션 | `?cursor=&limit=20` → `{ "items": [], "next_cursor": null }` |
    | 에러 | `{ "error": { "code", "message", "detail" } }` |
    | 번호판 | 응답은 `12가 3456`(공백 포함). 요청은 공백 유무 모두 허용하고 서버가 정규화 |

    ### Mock 데이터 시나리오 (기준 시각: 2026-09-30 수요일 14:40 KST)
    | 대상 | 내용 |
    |---|---|
    | 골목 1 | 광운로19가길. 빌라 3(월계 한빛빌라)과 빌라 4(햇살빌라)가 속함 |
    | 사용자 1 | 김지수 · 월계 한빛빌라 101동 202호 입주민 · 차량 7 (`12가 3456` 흰색, 대표) · 보유 토큰 30 |
    | 사용자 2 | 박OO · 한빛빌라 관리인 |
    | 사용자 3 | 101동 302호 이웃 · 차량 `34나 5678` (지수 차량을 막고 있음). 다른 입주민에게는 호수 대신 칸 이름·동까지만 보임 |
    | 빌라 3 | 월계 한빛빌라 (= 차고지 3), 초대코드 `HANBIT01`. 주차 구역 4개, 칸 8개: 구역 10 필로티 안쪽(1·2) / 11 필로티 외부(1) / 12 건물 앞(1·2·3) / 13 골목(1·2) |
    | 빌라 3 공유 조건 | 401 (P3), 402 (P7). 07~23시, 시간당 2토큰, 최대 4시간 |
    | 빌라 4 | 햇살빌라 (= 차고지 4). 구역 21 골목(칸 2101·2102) / 22 필로티 외부(2103·2104) / 23 건물 앞(2105). 공유 조건 501~505 (07~23시, 시간당 2토큰, 최대 4시간) |

    ### 와이어프레임 반영 사항
    - 차량 색상 선택지: 검정·흰색·은색·회색·파랑·빨강·기타 (온보딩 화면 #5)
    - 차량 관리 화면(#22)은 색상 대신 별칭·대표 설정만 있어 `color`, `alias` 를 모두 선택 입력으로 둠
    - 차고지 상세의 운영 시간·요금·최대 이용은 공유 칸들의 조건을 모아서 보여줌 (가장 이른 시작 ~ 가장 늦은 종료, 가장 싼 요금, 가장 긴 최대 이용)
    - 차고지 칸 상태는 `AVAILABLE` / `SOON_EXIT` / `IN_USE` (#14), 탐색 목록은 `AVAILABLE` / `SOON_EXIT` / `RESERVABLE` / `UNAVAILABLE` (#13)
    - 차고지 등록(#20)의 "최대 이용 시간: 제한 없음" 은 `max_hours: null`
    - 차고지 등록의 요일은 Figma 처럼 요일 칩 여러 개 선택 → `weekdays` 배열
    - 화면의 "○○원" 표기는 토큰으로 바꿔야 합니다 (#13, #14, #20)
    - 이동 요청에 긴급 구분이 없습니다. 이동 요청 수신 화면(#12)의 "긴급 이동 요청" 문구는 일반 "이동 요청" 으로 봅니다
    - 알림 종류는 와이어프레임에 나오는 5가지(막힘·이동 요청·출차 완료·공유 사용 요청·공유 결과)만 둡니다. 전날 밤 사전 알림은 막힘 알림(`BLOCK_ALERT`)에 포함
    - 차고지 등록(#20)의 시간 선택지는 정시 단위, 시작일·종료일 입력은 없음 (등록한 날부터 무기한, 중단은 `is_public=false`)
    - 이동 요청·막힘 관련 화면과 알림은 익명입니다. 호수·이름 대신 동(`101동 입주민`)이나 칸 이름(`P2 차량`)으로 표시
    - 사용 불가 안내 모달(#11)의 사유는 `관리인이 사용 중지한 칸` 또는 `예약된 상태` (Figma)

    ### 열린 질문 — Mock 에서 임시로 정한 값
    | # | 내용 | Mock 에서의 처리 |
    |---|---|---|
    | 1 | 홈 요약 칩 정의 (14-1) | 빈칸=비어 있는 칸, 가능=빈칸+1시간 내 출차, 막힘=막힌 입주민 차량 수 (제안안) |
    | 2 | 칸 이름 규칙 (14-2) | ✅ **확정 (2026-10-03, FE 합의)**: 칸 이름(`label`)은 빌라 안 순번 `P1`, `P2` … (Figma `주차 배치도 SVG` 표기). 순번은 주차 구역 `sort_order` → 칸 `number` 순. 주차 구역(`garages`)은 그대로 두고 화면에는 구역 이름을 쓰지 않음 |
    | 3 | 차량 색상 입력 (14-3) | 색상·별칭 모두 선택 |
    | 4 | 공유 요청 시간 입력 화면 없음 (14-4) | 요청 본문에 `request_date`, `start_hour`, `end_hour` 를 받음 |
    | 5 | 요금 단위 (14-5) | 시간당 토큰 `hourly_price`. Figma 최신본은 "시간당" 으로 고쳐져 있음 (Manyfast 차고지 상세의 "30분당" 은 옛 표기) |
    | 6 | 탐색 목록 단위 (14-6) | Figma 대로 **칸 단위** ("햇살빌라 · P2"). 탭하면 그 빌라의 차고지 상세로 이동 |
    | 7 | 온보딩 단계 (14-7) | Figma 최신본은 2단계(건물 합류 → 차량 등록)라 해결됨. `onboarding_step` 은 JOIN_BUILDING → REGISTER_VEHICLE → DONE |
    | 8 | 연락처 비노출 (14-9) vs 기존 "비노출 대상 아님" 기획 결정 | 본인에게만 마스킹 응답, 타인에겐 미제공 |
    | 9 | 와이어프레임 데이터 불일치 | 김지수 동·호수 #10 은 203호, #23 은 202호 → **202호** 사용 |
    | 10 | 와이어프레임 화면 링크 끊김 | 알림 목록(n26), 가입 완료(n7), 옮겼어요 완료(n31), 역할 안내(n54), 알림 설정(n55) 화면이 아직 없음. 알림 설정은 DB 에 저장할 곳이 없어 API 도 없음 |
    | 11 | 정의되지 않은 에러 코드 | `PLATE_EXISTS`, `ALREADY_DECIDED`, `MOVE_REQUEST_ALREADY_PENDING`, `ALREADY_IN_BUILDING`, `INSUFFICIENT_TOKENS` 를 **제안**으로 추가 |
    | 12 | 차고지 등록 화면(#20)의 이름·상세 위치 | 차고지 = 빌라라서 이름·위치는 빌라의 `name`·`address` 를 씀. 화면의 차고지 이름·상세 위치 입력은 저장할 곳이 없어 받지 않음. 여러 칸을 고르면 칸마다 공유 조건이 하나씩 생김 |
    | 13 | DB 에 없어서 뺀 필드 | 칸의 `is_shareable`(칸 설정 모달 #19 의 "공유 가능" 토글)·`unavailable_reason`, 차고지 상세의 유의 사항, 차고지 사진(`thumbnail_url`, `image_url`)·유의사항(`notices`), 배치도 이미지(`layout_image_url`)·출입구 좌표. 필요하면 컬럼 추가 필요 |
    | 14 | 빌라 이동·탈퇴 | 한 빌라에만 소속되므로 이사하면 기존 빌라에서 나가야 하는데 그 API·화면이 없음 |
    | 15 | 토큰 충전·내역 화면 없음 | 보유 토큰은 `GET /users/me` 의 `token_balance` 로만 확인. **가입할 때 500,000 토큰 지급** (시스템 지급, `token_transfers` 에 보낸 사람 NULL 로 기록). 관리인 계정은 운영자가 DB 에 직접 넣음 |
    | 16 | 이름만 DB 와 다른 값 | 역할 `ADMIN`(DB `MANAGER`), 공유 요청 `APPROVED`(DB `ACCEPTED`), 대표 차량 `is_default`(DB `is_primary`), 차량 `alias`(DB `nickname`) — Notion 이름을 유지함. 이동 요청 상태는 DB 값(`MOVED`) 을 그대로 씀 |
    | 17 | 알림 종류 | 와이어프레임 기준 5종. DB 는 마이그레이션 0004 로 맞춤 (`DEPARTURE_REMINDER`→`BLOCK_ALERT`, `SHARE_RESPONSE`→`SHARE_RESULT`, `EXIT_DONE` 추가, `MOVE_RESPONSE` 제거) |
    | 18 | 공유 기간 vs 요구사항 | Manyfast 요구사항 R-UWUBSH 는 "이용 가능 **날짜**·시간" 을 등록한다고 하지만 화면에 날짜 입력이 없어 무기한으로 처리 |
    | 19 | 배치 추천 규칙 (#9) | ✅ **확정 (2026-10-03, 사용자 결정)**: 추천(`RECOMMENDED`)은 **가장 이상적인 칸 한 칸**만. 조건에 맞는 칸이 없으면 추천하지 않음(`RECOMMENDED` 없음). 차가 있는 칸은 새 태그 `OCCUPIED`. 자세한 규칙은 `GET /buildings/{building_id}/slots/recommendations` 설명 참고 |
servers:
  - url: http://localhost:8000/api/v1
    description: 로컬
security:
  - bearerAuth: []
tags:
  - { name: auth, description: "인증 (#2 계정 만들기, #3 로그인)" }
  - { name: users, description: "프로필 (#23)" }
  - { name: buildings, description: "건물 합류(#4), 배치도·실시간 현황(#6). 한 사용자는 한 빌라에만 소속" }
  - { name: home, description: "홈 집계 (#6)" }
  - { name: vehicles, description: "차량 등록·관리·상세 (#5, #10, #22), 반복 출차 일정 (#9)" }
  - { name: parkings, description: "주차 배치 등록·출차 일정 수정·출차 (#7, #8, #11)" }
  - { name: move-requests, description: "이동 요청 (#12)" }
  - { name: garages, description: "공유 주차 탐색·차고지 상세 (#13, #14). 차고지 = 같은 골목에 있는 다른 빌라의 주차장" }
  - { name: share-requests, description: "공유 요청과 결과 확인 (#15~#17). 이용료는 토큰" }
  - { name: admin, description: "관리인 (#18~#21), 🛠 해당 빌라 관리인만" }
  - { name: notifications, description: "알림 목록 (알림 탭, 화면 미작성)" }
  - { name: health, description: 상태 확인 }

paths:
  # ───────────────────────── 인증 ─────────────────────────
  /auth/signup:
    post:
      tags: [auth]
      summary: 🔓 계정 만들기 (#2)
      description: |
        비밀번호 확인 일치 검사는 FE 에서 합니다. `agree_terms=false` 면 400.
        가입 직후 `onboarding_step` 은 `JOIN_BUILDING` 입니다.
      operationId: signup
      x-priority: 1주차
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: 가입 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "409":
          description: 이메일 중복
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: EMAIL_EXISTS, message: 이미 가입된 이메일입니다., detail: null } }
  /auth/login:
    post:
      tags: [auth]
      summary: 🔓 로그인 (#3)
      operationId: login
      x-priority: 1주차
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공 (응답은 signup 과 동일)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: INVALID_CREDENTIALS, message: 이메일 또는 비밀번호가 올바르지 않습니다., detail: null } }
  /auth/refresh:
    post:
      tags: [auth]
      summary: 🔓 액세스 토큰 재발급
      operationId: refreshToken
      x-priority: 1주차
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
            example: { refresh_token: eyJhbGciOiJIUzI1NiJ9.refresh }
      responses:
        "200":
          description: 새 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
              example: { access_token: eyJhbGciOiJIUzI1NiJ9.access2, refresh_token: eyJhbGciOiJIUzI1NiJ9.refresh2 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password-reset:
    post:
      tags: [auth]
      summary: 🔓 계정 찾기 (향후)
      operationId: passwordReset
      x-priority: 향후
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example: { email: kim@kw.ac.kr }
      responses:
        "202": { description: "재설정 메일 발송 (가입 여부와 관계없이 202)" }

  # ───────────────────────── 사용자 ─────────────────────────
  /users/me:
    get:
      tags: [users]
      summary: 👤 내 정보 (#23)
      operationId: getMe
      x-priority: 1주차
      responses:
        "200":
